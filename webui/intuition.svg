<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="1" stop-color="#4f7df9"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- eye outline (watching quietly) -->
  <path d="M 18 66 Q 64 30 110 66 Q 64 102 18 66 Z"
        fill="#ffffff" fill-opacity="0.10"
        stroke="#ffffff" stroke-opacity="0.95" stroke-width="5" stroke-linejoin="round"/>

  <!-- whisper ripples -->
  <circle cx="64" cy="66" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>
  <circle cx="64" cy="66" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5"/>
  <circle cx="64" cy="66" r="7.5" fill="#ffffff"/>

  <!-- idea spark -->
  <path d="M 97 22 L 99.6 29.4 L 107 32 L 99.6 34.6 L 97 42 L 94.4 34.6 L 87 32 L 94.4 29.4 Z" fill="url(#spark)"/>

  <!-- tiny companion spark -->
  <circle cx="86" cy="20" r="3" fill="#ffe08a" fill-opacity="0.9"/>
</svg>
